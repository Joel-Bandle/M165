global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['localhost:9100']

  - job_name: film_metrics_app
    static_configs:
      - targets: ['localhost:8000']

rule_files:
  - "/etc/prometheus/rules.yml"
